name: Deploy (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ['www/**', 'edge/**', '.github/workflows/deploy.yml']
  pull_request:
    branches: [main]
    paths: ['www/**', 'edge/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            www/pnpm-lock.yaml
            edge/pnpm-lock.yaml

      - name: Remove local-only workspace deps
        working-directory: ./www
        run: |
          echo -e 'packages:\n  - .' > pnpm-workspace.yaml
          node -e "
            const p = require('./package.json');
            delete p.devDependencies.scrns;
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Install dependencies
        working-directory: ./www
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: ./www
        env:
          # Map data (DVC cache) is served same-origin by the `jct-edge`
          # Worker's `/d/*` route (compressed, edge-cached; see edge/README.md).
          VITE_DVC_BASE_URL: /d
        run: pnpm run build

      - name: Install Playwright
        working-directory: ./www
        run: npx playwright install --with-deps chromium

      - name: Test
        working-directory: ./www
        run: pnpm test

      - name: Install edge dependencies
        if: github.ref == 'refs/heads/main'
        working-directory: ./edge
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        if: github.ref == 'refs/heads/main'
        working-directory: ./edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy
